<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BilimGames</title>
  <link rel="stylesheet" href="hub/hub.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#" data-go="home" aria-label="BilimGames">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11"/>
        <path d="M8 26c0-6 4-10 9-10 4 0 6 3 6 5.5S21 26 18.5 26 15 24.5 15 22.5M32 26c0-6-4-10-9-10"/>
      </svg>
      <span>Bilim<b>Games</b></span>
    </a>
    <div class="lang" role="radiogroup" aria-label="Тіл / Язык / Language">
      <button type="button" role="radio" data-lang="kz">Қаз</button>
      <button type="button" role="radio" data-lang="ru">Рус</button>
      <button type="button" role="radio" data-lang="en">Eng</button>
    </div>
  </header>

  <main>
    <!-- Шаг 1: приветствие -->
    <section class="view is-active" id="view-home" aria-labelledby="home-title">
      <div class="home">
        <div class="home__text">
          <p class="eyebrow" data-t="eyebrow"></p>
          <h1 id="home-title" data-t="title"></h1>
          <p class="lead" data-t="lead"></p>
          <ul class="facts" id="facts"></ul>
          <button class="btn btn--play" data-go="subjects"><span data-t="play"></span> <kbd>Enter</kbd></button>
        </div>
        <div class="home__art" aria-hidden="true">
          <img src="history-kz/assets/cover.png" alt="" class="art art--back">
          <img src="english/tech-trail/assets/cover.png" alt="" class="art art--front">
        </div>
      </div>
    </section>

    <!-- Шаг 2: предмет -->
    <section class="view" id="view-subjects" aria-labelledby="subjects-title">
      <div class="step">
        <button class="back" data-back><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span data-t="back"></span></button>
        <p class="eyebrow"><span data-t="step"></span> 1 / 2</p>
        <h2 id="subjects-title" data-t="chooseSubject"></h2>
        <div class="tiles tiles--2" id="subjects"></div>
      </div>
    </section>

    <!-- Шаг 3: тема -->
    <section class="view" id="view-topics" aria-labelledby="topics-title">
      <div class="step">
        <button class="back" data-back><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span data-t="back"></span></button>
        <p class="eyebrow"><span data-t="step"></span> 2 / 2 · <span id="topics-subject"></span></p>
        <h2 id="topics-title" data-t="chooseTopic"></h2>
        <div class="tiles" id="topics"></div>
      </div>
    </section>
  </main>

  <script src="hub/hub.js"></script>
</body>
</html>
